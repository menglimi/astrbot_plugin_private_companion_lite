[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-plugin-private-companion"
version = "7.0.0+lite"
description = "我会永远陪着你 Lite core companion host"
requires-python = ">=3.10"
dependencies = ["Pillow>=12,<15", "tzdata>=2025.2; sys_platform == \"win32\"", "cryptography>=42", "lunarcalendar>=0.0.9", "regex>=2024.11.6", "PyMuPDF>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6.23"]

[tool.setuptools.packages.find]
include = ["companion_v2*"]
